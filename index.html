<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Φόρμα Επικοινωνίας</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: transparent; 
            margin: 0; padding: 10px;
            display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh;
        }
        .contact-form {
            background: #fff; padding: 25px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            max-width: 450px; width: 100%;
        }
        .contact-form .info {
            font-size: 13px; color: #666; text-align: center;
            margin-bottom: 20px; line-height: 1.4;
            border-bottom: 1px solid #eee; padding-bottom: 15px;
        }
        .contact-form h2 { margin-bottom: 20px; color: #222; text-align: center; font-size: 22px; }
        .contact-form input, .contact-form textarea {
            width: 100%; margin-bottom: 15px; padding: 12px;
            border-radius: 6px; border: 1px solid #ddd; font-size: 15px;
            outline: none; transition: border-color 0.3s;
        }
        .contact-form input:focus, .contact-form textarea:focus { border-color: #0078d7; }
        .contact-form button {
            width: 100%; background-color: #0078d7; color: #fff;
            border: none; padding: 14px; border-radius: 6px;
            cursor: pointer; font-size: 16px; font-weight: bold;
            transition: background 0.3s;
        }
        .contact-form button:hover { background-color: #005a9e; }
        .contact-form button:disabled { background-color: #ccc; }

        .share-section { margin-top: 25px; padding-top: 20px; border-top: 1px solid #eee; text-align: center; }
        .share-section p { font-size: 12px; color: #888; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .share-links { display: flex; justify-content: center; gap: 12px; }
        .share-btn {
            display: flex; align-items: center; justify-content: center;
            width: 36px; height: 36px; border-radius: 50%; color: #fff;
            text-decoration: none; font-size: 16px; font-weight: bold;
            transition: transform 0.2s, opacity 0.2s;
        }
        .share-btn:hover { transform: translateY(-3px); opacity: 0.9; }
        .fb { background-color: #3b5998; }
        .tw { background-color: #000000; } 
        .li { background-color: #0077b5; }
        .mail { background-color: #ea4335; }
    </style>
</head>
<body>

<div class="contact-form">
    <div class="info" style="border-bottom: none; margin-bottom: 0; padding-bottom: 5px;">
        <strong>Σχεδίαση & επεξεργασία δεδομένων:</strong>
    </div>
    <div class="info" style="border-bottom: none; margin-bottom: 0; padding-bottom: 5px;">
        Τζαννής Στυλιανός
    </div>
    <div class="info" style="border-bottom: none; margin-bottom: 0; padding-bottom: 5px;">
        <strong>Επιβλέπων καθηγητής:</strong>
    </div>
    <div class="info" style="border-bottom: none; margin-bottom: 0; padding-bottom: 5px;">
        Βασιλάκος Χρήστος, Επίκουρος Καθηγητής
    </div>
    <div class="info" style="border-bottom: none; margin-bottom: 0; padding-bottom: 5px;">
        Ερευνητική ομάδα Τηλεπισκόπησης και ΣΓΠ,<br>
        Πανεπιστήμιο Αιγαίου
    </div>
    <div id="form-content">
        <h2>Επικοινωνία</h2>
        <form id="my-form" action="https://formsubmit.co/ajax/98acfeccd0ce52724c06f256835ebe4c,1cd716b9cc4ed27ed7c737a465982e12" method="POST">
            <input type="text" name="_honey" style="display:none">
            <input type="text" name="name" placeholder="Ονοματεπώνυμο" required>
            <input type="email" name="email" placeholder="Email" required>
            <textarea name="message" rows="4" placeholder="Το μήνυμά σας..." required></textarea>
            <input type="hidden" name="_captcha" value="false">
            <button type="submit" id="submit-btn">Αποστολή</button>
        </form>
    </div>

    <div id="success-msg" style="display:none; text-align:center; padding: 20px;">
        <h3 style="color: #28a745;">✓ Ευχαριστούμε!</h3>
        <p>Το μήνυμά σας στάλθηκε με επιτυχία.</p>
    </div>

    <div class="share-section">
        <p>Κοινοποίηση</p>
        <div class="share-links">
            <a href="https://www.facebook.com/sharer/sharer.php?u=https://arcg.is/0b4LOf0" target="_blank" class="share-btn fb">f</a>
            <a href="https://twitter.com/intent/tweet?url=https://arcg.is/0b4LOf0" target="_blank" class="share-btn tw">𝕏</a>
            <a href="https://www.linkedin.com/sharing/share-offsite/?url=https://arcg.is/0b4LOf0" target="_blank" class="share-btn li">in</a>
            <a href="mailto:?subject=Χαρτογραφική εφαρμογή διαχείρισης πρκαγιών Χίου&body=Δείτε τη διαδραστική εαφρμογή εδώ: https://arcg.is/0b4LOf0" class="share-btn mail">✉</a>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('my-form');
    const formContent = document.getElementById('form-content');
    const successMsg = document.getElementById('success-msg');
    const btn = document.getElementById('submit-btn');

    form.addEventListener("submit", function(e) {
        e.preventDefault();
        btn.innerHTML = "Αποστολή...";
        btn.disabled = true;

        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());

        fetch(form.action, {
            method: "POST",
            headers: { 
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify(data)
        })
        .then(response => {
            // Αυτό είναι το κομμάτι που "έφτιαξε" το θέμα. 
            // Μόλις η απάντηση είναι OK, κρύβουμε τη φόρμα.
            if (response.ok) {
                formContent.style.display = 'none';
                successMsg.style.display = 'block';
            } else {
                alert("Σφάλμα στην αποστολή.");
                btn.innerHTML = "Αποστολή";
                btn.disabled = false;
            }
        })
        .catch(error => {
            // Σε περίπτωση σφάλματος δικτύου
            formContent.style.display = 'none';
            successMsg.style.display = 'block';
        });
    });
</script>

</body>
</html>
